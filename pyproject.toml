[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrytrace"
version = "0.1.0"
description = "Air-gapped on-device incident forensics and log analysis agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
    "pywebview>=5.0.0",
]

[project.scripts]
sentrytrace = "sentrytrace.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentrytrace*"]