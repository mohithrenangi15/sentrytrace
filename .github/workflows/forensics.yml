name: CI & Incident Forensics

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  forensics-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & SentryTrace
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run Forensic Scan on Incident Logs
        run: |
          # Executes SentryTrace in CI mode and saves structured JSON telemetry
          sentrytrace scan logs/server_crash.log --json > incident_report.json
          
          # Print the report to the pipeline logs
          cat incident_report.json

      - name: Upload Incident Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: incident-forensics-report
          path: incident_report.json